name: E-Commerce CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install
      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: npm test

  build-frontend:
    name: Build Frontend React SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build

  build-docker:
    name: Build Docker Containers
    needs: [lint-and-test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Docker Image
        run: docker build -t ecommerce-backend:latest ./backend
      - name: Build Frontend Docker Image
        run: docker build -t ecommerce-frontend:latest ./frontend

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Staging Deployment Script
        run: bash aws-deploy.sh
