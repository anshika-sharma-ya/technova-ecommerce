version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ecommerce_backend
    ports:
      - "5000:5000"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ecommerce_db
      DB_USER: postgres
      DB_PASS: postgrespassword
      JWT_SECRET: super_secret_intern_key_2026
      PORT: 5000
    depends_on:
      - postgres_db

  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
